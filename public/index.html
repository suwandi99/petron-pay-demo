<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b3c8c" />
  <title>Petron Pay – Adyen demo</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="stage">
    <div class="phone" id="phone">
      <div class="statusbar"><span>9:41</span><span>Petron Pay · demo</span></div>
      <header class="appbar">
        <button class="back" id="back" aria-label="Back" hidden>‹</button>
        <img id="logo" alt="Petron" hidden />
        <h1 id="title">Petron Pay</h1>
      </header>
      <main id="screen"></main>
      <nav class="tabs" id="tabs">
        <button data-tab="home"><span class="ic">🏠</span>Home</button>
        <button data-tab="pump"><span class="ic">⛽</span>Pump</button>
        <button data-tab="topup"><span class="ic">💳</span>Top up</button>
        <button data-tab="cards"><span class="ic">🗂️</span>Cards</button>
        <button data-tab="activity"><span class="ic">🧾</span>Activity</button>
      </nav>
    </div>
  </div>
  <script src="/js/shared.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
